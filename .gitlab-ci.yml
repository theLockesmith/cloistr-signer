stages:
  - test
  - build

include:
  - project: 'coldforge/ci-templates'
    ref: main
    file: '/templates/cloistr-rules.yml'
  - project: 'coldforge/ci-templates'
    ref: main
    file: '/templates/go-test.yml'
  - project: 'coldforge/ci-templates'
    ref: main
    file: '/templates/kaniko-build.yml'

.go-cache: &go-cache
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .go/pkg/mod/
    policy: pull-push

# bookworm + build-essential because -race needs cgo, and the alpine images
# have no C toolchain. Matches cloistr-vault/cloistr-relay.
#
# Scoped to ./internal/... (as in cloistr-relay): that is where every test lives,
# and it keeps the test-free cmd/ packages out of the race build. The suite is
# slow under -race (internal/api alone is several minutes), hence the timeout.


build:
  extends: .kaniko-build
  stage: build

test:unit:
  extends: [.go-test, .cloistr-rules]
  variables:
    GO_TEST_PACKAGES: "./internal/..."

# UI unit tests (vitest, node environment — no browser required).
# Runs in the same test stage as the Go suite so a failing test blocks build.
test:ui:
  stage: test
  extends: .cloistr-rules
  image: node:20.20.2-bookworm-slim
  before_script:
    - cd ui
    - npm ci --ignore-scripts
  script:
    - npm run test
  cache:
    key:
      files:
        - ui/package-lock.json
    paths:
      - ui/node_modules/
    policy: pull-push

# Builds the frost WASM from source on every pipeline, and fails if the module
# committed in internal/web/dist is not byte-identical to that build. Without
# this job nothing compiled ui/frost-wasm in CI: every Renovate cargo bump from
# 2026-08-11 on merged green while the crate no longer built, and the shipped
# module silently stopped matching its manifest.
#
# Toolchain is pinned (rustc 1.96.0, wasm-pack 0.15.0) because wasm output is
# only reproducible for a fixed compiler and wasm-opt; build.sh remaps absolute
# paths so the builder's directories do not end up in the binary.
test:frost-wasm:
  stage: test
  extends: .cloistr-rules
  image: rust:1.96.0-slim-bookworm
  variables:
    CARGO_HOME: ${CI_PROJECT_DIR}/.cargo-home
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates curl >/dev/null
    - rustup target add wasm32-unknown-unknown
    - curl -sSfL https://github.com/rustwasm/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz | tar xz -C /usr/local/bin --strip-components=1 wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack
  script:
    - cd ui/frost-wasm
    - cargo test --release --locked
    - ./build.sh
    - built=$(sha256sum pkg/cloistr_frost_wasm_bg.wasm | cut -d' ' -f1)
    - shipped=$(sha256sum ../../internal/web/dist/assets/cloistr_frost_wasm_bg-*.wasm | cut -d' ' -f1)
    - echo "built=${built} shipped=${shipped}"
    - |
      if [ "${built}" != "${shipped}" ]; then
        echo "FAIL: the frost WASM committed in internal/web/dist was not built from this source + Cargo.lock."
        echo "Rebuild: cd ui && npm run build:wasm && npm run build, then commit internal/web/dist."
        exit 1
      fi
  cache:
    key:
      files:
        - ui/frost-wasm/Cargo.lock
    paths:
      - .cargo-home/registry/
      - ui/frost-wasm/target/
    policy: pull-push

lint:
  extends: [.go-lint, .cloistr-rules]
