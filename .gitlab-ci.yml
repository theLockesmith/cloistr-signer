stages:
  - test
  - build

include:
  - project: 'coldforge/ci-templates'
    ref: main
    file: '/templates/cloistr-rules.yml'
  - project: 'coldforge/ci-templates'
    ref: main
    file: '/templates/go-test.yml'
  - project: 'coldforge/ci-templates'
    ref: main
    file: '/templates/kaniko-build.yml'

.go-cache: &go-cache
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .go/pkg/mod/
    policy: pull-push

# bookworm + build-essential because -race needs cgo, and the alpine images
# have no C toolchain. Matches cloistr-vault/cloistr-relay.
#
# Scoped to ./internal/... (as in cloistr-relay): that is where every test lives,
# and it keeps the test-free cmd/ packages out of the race build. The suite is
# slow under -race (internal/api alone is several minutes), hence the timeout.


build:
  extends: .kaniko-build
  stage: build

test:unit:
  extends: [.go-test, .cloistr-rules]
  variables:
    GO_TEST_PACKAGES: "./internal/..."

# UI unit tests (vitest, node environment — no browser required).
# Runs in the same test stage as the Go suite so a failing test blocks build.
test:ui:
  stage: test
  extends: .cloistr-rules
  image: node:20.20.2-bookworm-slim
  before_script:
    - cd ui
    - npm ci --ignore-scripts
  script:
    - npm run test
  cache:
    key:
      files:
        - ui/package-lock.json
    paths:
      - ui/node_modules/
    policy: pull-push

lint:
  extends: [.go-lint, .cloistr-rules]
