stages:
  - test
  - build

include:
  - project: 'coldforge/ci-templates'
    ref: main
    file: '/templates/cloistr-rules.yml'
  - project: 'coldforge/ci-templates'
    ref: main
    file: '/templates/kaniko-build.yml'

.go-cache: &go-cache
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .go/pkg/mod/
    policy: pull-push

# bookworm + build-essential because -race needs cgo, and the alpine images
# have no C toolchain. Matches cloistr-vault/cloistr-relay.
#
# Scoped to ./internal/... (as in cloistr-relay): that is where every test lives,
# and it keeps the test-free cmd/ packages out of the race build. The suite is
# slow under -race (internal/api alone is several minutes), hence the timeout.
test:unit:
  extends: .cloistr-rules
  stage: test
  image: golang:1.25-bookworm
  <<: *go-cache
  variables:
    GOPATH: ${CI_PROJECT_DIR}/.go
    CGO_ENABLED: "1"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates build-essential
    - mkdir -p .go
  script:
    - go mod tidy
    - go test -race -timeout 25m -cover ./internal/...
  coverage: '/coverage: \d+\.\d+% of statements/'
  timeout: 30m

lint:
  extends: .cloistr-rules
  stage: test
  image: golang:1.25-bookworm
  <<: *go-cache
  variables:
    GOPATH: ${CI_PROJECT_DIR}/.go
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl
    - mkdir -p .go
    - curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.11.2
    - go mod tidy
  script:
    - ${GOPATH}/bin/golangci-lint run --timeout 15m ./...
  allow_failure: true

build:
  extends: .kaniko-build
  stage: build
